<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato Esportivo</title>
</head>

<link rel="stylesheet" href="/css/style.css">

<body>
    <h1>Campeonato Esportivo</h1>

    <p>Versão 1.0.0 | Data: 08/11/2026</p>

        <section id="painel">
            <p>Total de partidas: <span id="total-partidas"></span></p>
            <p>Partidas pendentes: <span id="partidas-pendentes"></span></p>
        </section>

<section id="area-autenticacao">
    <h2>Acessar Campeonato Esportivo</h2>

    <form id="form-login">
        <h3>Entrar</h3>
        <input id="login-email" type="email" placeholder="E-mail" required>
        <input id="login-senha" type="password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>

    <form id="form-cadastro">
        <h3>Criar conta</h3>
        <input id="cadastro-nome" type="text" placeholder="Nome" required>
        <input id="cadastro-email" type="email" placeholder="E-mail" required>
        <input id="cadastro-senha" type="password" placeholder="Senha" minlength="8" required>
        <button type="submit">Cadastrar</button>
    </form>

    <p id="erro-auth" role="alert"></p>
</section>

<section id="area-usuario" hidden>
    <p>Bem-vindo, <strong id="nome-usuario"></strong>!</p>
    <button id="botao-sair" type="button">Sair</button>
</section>

        <section>
    <h2 style="text-align: center;">Cadastrar partida</h2>

    <form id="formulario" style="text-align: center;">
        <label for="modalidade">Modalidade:</label>
        <select id="modalidade" required>
            <option value="futebol">Futebol</option>
            <option value="futsal">Futsal</option>
            <option value="basquete">Basquete</option>
            <option value="volei">Vôlei</option>
        </select>

        <label for="time1">Primeiro time:</label>
        <input id="time1" type="text" required minlength="3">

        <label for="time2">Segundo time:</label>
        <input id="time2" type="text" required minlength="3">

        <label for="data">Data da partida:</label>
        <input id="data" type="datetime-local" required>

        <button type="submit">Cadastrar</button>

<p id="erro" role="alert"></p>
</form>
<br> <br> <br> 
</section>

    <main id="lista-partidas"></main>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
